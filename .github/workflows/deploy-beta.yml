name: Build and deploy the beta redesign

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved beta design
        uses: actions/checkout@v4
        with:
          ref: 6f7f9ffc88843497b46be784cf77cb22644e3488
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use the validated production data snapshot
        uses: actions/download-artifact@v4
        with:
          name: validated-beta-data
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: validated-aws-site
          path: ${{ runner.temp }}/production
      - run: npm ci
      - name: Build and validate beta
        run: npm test && npm run build
      - name: Require the exact validated production catalog
        run: |
          unzip -p "$RUNNER_TEMP/production/rivspotter-site.zip" api/v1/catalog.json > "$RUNNER_TEMP/production-catalog.json"
          cmp "$RUNNER_TEMP/production-catalog.json" dist/api/v1/catalog.json
          cd dist && zip -qr "$RUNNER_TEMP/rivspotter-beta.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: validated-beta-site
          path: ${{ runner.temp }}/rivspotter-beta.zip
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted deployment helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-beta-site
          path: ${{ runner.temp }}/beta
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_AMPLIFY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy only to beta
        env:
          AMPLIFY_APP_ID: ${{ vars.AWS_AMPLIFY_APP_ID }}
        run: node scripts/deploy-amplify.cjs "$RUNNER_TEMP/beta/rivspotter-beta.zip" beta
