name: Release beta design

on:
  workflow_dispatch:
    inputs:
      design_sha:
        description: Exact beta-main commit to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-refs/heads/main
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && vars.BETA_DATA_PUBLISH_ENABLED == 'true' && vars.BETA_DYNAMIC_RENDER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          persist-credentials: false
      - name: Validate beta-main head and deployed design
        id: designs
        env:
          REQUESTED_SHA: ${{ inputs.design_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/beta-main" --jq .sha)
          [ "$REQUESTED_SHA" = "$head_sha" ] || { echo 'A newer beta-main commit exists; do not publish this one.' >&2; exit 1; }
          status=$(curl --silent --show-error -o "$RUNNER_TEMP/old-beta-release.json" -w '%{http_code}' https://beta.d3qy7654vf25z2.amplifyapp.com/beta-release.json)
          if [ "$status" = 404 ]; then
            old_sha=6f7f9ffc88843497b46be784cf77cb22644e3488
          elif [ "$status" = 200 ]; then
            old_sha=$(node -e 'const x=require(process.argv[1]);if(x.schemaVersion!==1||!/^[a-f0-9]{40}$/.test(x.designSha))process.exit(1);process.stdout.write(x.designSha)' "$RUNNER_TEMP/old-beta-release.json")
          else
            echo "Cannot read deployed beta release (HTTP $status)" >&2; exit 1
          fi
          echo "old=$old_sha" >> "$GITHUB_OUTPUT"
          echo "new=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout the previous beta design
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.designs.outputs.old }}
          path: old
          persist-credentials: false
      - name: Checkout the requested beta design
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.designs.outputs.new }}
          path: new
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test both designs against current main data
        run: |
          for dir in old new; do
            rm -rf "$dir/data"
            cp -R main/data "$dir/data"
            ( cd "$dir" && npm ci && npm run build && npm test )
          done
          curl --fail --silent --show-error https://rivspotter.com/api/v1/catalog.json > "$RUNNER_TEMP/production-catalog.json"
          cmp "$RUNNER_TEMP/production-catalog.json" old/dist/api/v1/catalog.json
          cmp "$RUNNER_TEMP/production-catalog.json" new/dist/api/v1/catalog.json
      - name: Assemble coordinated shell and data releases
        env:
          BETA_OLD_SHA: ${{ steps.designs.outputs.old }}
          BETA_NEW_SHA: ${{ steps.designs.outputs.new }}
        run: |
          node main/scripts/assemble-beta-design.cjs old/dist new/dist "$RUNNER_TEMP/release"
          for dir in old-shell new-shell; do
            name=${dir//\//-}
            (cd "$RUNNER_TEMP/release/$dir" && zip -qr "$RUNNER_TEMP/$name.zip" .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: beta-coordinated-design
          path: |
            ${{ runner.temp }}/old-shell.zip
            ${{ runner.temp }}/new-shell.zip
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: beta-coordinated-design
          path: ${{ runner.temp }}/release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_AMPLIFY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Stage old and new immutable assets without changing design
        env:
          AMPLIFY_APP_ID: ${{ vars.AWS_AMPLIFY_APP_ID }}
        run: node scripts/deploy-amplify.cjs "$RUNNER_TEMP/release/old-shell.zip" beta
      - name: Require the requested design still be the branch head
        env:
          REQUESTED_SHA: ${{ inputs.design_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/beta-main" --jq .sha)
          [ "$REQUESTED_SHA" = "$head_sha" ] || { echo 'A newer beta-main commit exists; do not publish this one.' >&2; exit 1; }
      - name: Publish the new beta shell
        env:
          AMPLIFY_APP_ID: ${{ vars.AWS_AMPLIFY_APP_ID }}
        run: node scripts/deploy-amplify.cjs "$RUNNER_TEMP/release/new-shell.zip" beta
