name: Validate and publish static site

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: node --test tests/*.test.cjs
      - name: Build static output
        run: npm run build
      - name: Audit production dependencies
        run: node scripts/audit-dependencies.cjs
      - name: Package the validated AWS artifact
        if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: cd dist && zip -qr "$RUNNER_TEMP/rivspotter-site.zip" .
      - name: Preserve the validated AWS artifact
        if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-aws-site
          path: ${{ runner.temp }}/rivspotter-site.zip
          retention-days: 7
      - name: Preserve data for the beta build
        if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-beta-data
          path: data/
          retention-days: 7
      - name: Preserve the validated catalog
        if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-catalog
          path: dist/api/v1/catalog.json
          retention-days: 7

  deploy_aws:
    if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [build, publish_production_json]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-aws-site
          path: ${{ runner.temp }}/aws-site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_AMPLIFY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy the production artifact
        env:
          AMPLIFY_APP_ID: ${{ vars.AWS_AMPLIFY_APP_ID }}
        run: node scripts/deploy-amplify.cjs "$RUNNER_TEMP/aws-site/rivspotter-site.zip" production-shell

  deploy_beta:
    if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && vars.BETA_DATA_PUBLISH_ENABLED != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-beta.yml

  publish_beta_data:
    if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && vars.BETA_DATA_PUBLISH_ENABLED == 'true' && vars.BETA_DYNAMIC_RENDER_ENABLED != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/beta-data-publish.yml
    with:
      use_refresh_artifact: true

  publish_beta_json:
    if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && vars.BETA_DATA_PUBLISH_ENABLED == 'true' && vars.BETA_DYNAMIC_RENDER_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/beta-json-publish.yml
    with:
      use_refresh_artifact: true

  publish_production_json:
    if: ${{ vars.AMPLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/production-json-publish.yml
