name: Publish production JSON snapshot

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      use_refresh_artifact:
        type: boolean
        default: true

permissions:
  contents: read

# A standalone recovery shares the production lock. Reusable calls are already
# protected by their caller and must never acquire its lock a second time.
concurrency:
  group: ${{ inputs.use_refresh_artifact != true && github.event_name == 'workflow_dispatch' && 'pages-refs/heads/main' || format('production-json-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated main data
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.use_refresh_artifact == true && github.sha || 'main' }}
          path: main
          persist-credentials: false
      - name: Clear the checkout data before restoring the refresh snapshot
        if: ${{ inputs.use_refresh_artifact == true }}
        run: rm -rf main/data
      - name: Use the refresh snapshot
        if: ${{ inputs.use_refresh_artifact == true }}
        uses: actions/download-artifact@v4
        with:
          name: validated-location-data
          path: main/data
      - name: Fetch the refresh catalog artifact
        if: ${{ inputs.use_refresh_artifact == true }}
        uses: actions/download-artifact@v4
        with:
          name: validated-catalog
          path: ${{ runner.temp }}/production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify catalog belongs to the validated data
        env:
          FROM_REFRESH: ${{ inputs.use_refresh_artifact }}
        run: |
          if [ "$FROM_REFRESH" = true ]; then
            cp "$RUNNER_TEMP/production/catalog.json" "$RUNNER_TEMP/expected-catalog.json"
          fi
          ( cd main && node -e "const fs=require('fs'); const c=require('./scripts/export-ios-catalog.cjs').catalog({updateRevision:false}); fs.writeFileSync(process.argv[1],JSON.stringify(c)+'\\n')" "$RUNNER_TEMP/computed-catalog.json" )
          if [ "$FROM_REFRESH" = true ]; then
            cmp "$RUNNER_TEMP/expected-catalog.json" "$RUNNER_TEMP/computed-catalog.json"
          else
            cp "$RUNNER_TEMP/computed-catalog.json" "$RUNNER_TEMP/expected-catalog.json"
          fi
      - name: Package JSON and sitemap only
        run: |
          node main/scripts/beta-json-snapshot.cjs main/data "$RUNNER_TEMP/expected-catalog.json" "$RUNNER_TEMP/beta-data"
          cd "$RUNNER_TEMP/beta-data"
          zip -qr "$RUNNER_TEMP/beta-data.zip" api data sitemap.xml
      - uses: actions/upload-artifact@v4
        with:
          name: validated-production-data-site
          path: ${{ runner.temp }}/beta-data.zip
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-production-data-site
          path: ${{ runner.temp }}/beta-data
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_AMPLIFY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy and verify the production data origin
        env:
          AMPLIFY_APP_ID: ${{ vars.AWS_AMPLIFY_APP_ID }}
        run: node scripts/deploy-amplify.cjs "$RUNNER_TEMP/beta-data/beta-data.zip" production-data
