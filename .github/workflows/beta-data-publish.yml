name: Publish beta data snapshot

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      use_refresh_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.BETA_DATA_PUBLISH_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated main data
        uses: actions/checkout@v4
        with:
          path: main
          persist-credentials: false
      - name: Resolve the actually deployed beta design
        id: release
        run: |
          status=$(curl --silent --show-error -o "$RUNNER_TEMP/beta-release.json" -w '%{http_code}' https://beta.d3qy7654vf25z2.amplifyapp.com/beta-release.json)
          if [ "$status" = 404 ]; then
            sha=6f7f9ffc88843497b46be784cf77cb22644e3488
            shell=2026.47.0-270f5b1dd20f
            design=
          elif [ "$status" = 200 ]; then
            sha=$(node -e 'const x=require(process.argv[1]); if(x.schemaVersion!==1 || !/^[a-f0-9]{40}$/.test(x.designSha))process.exit(1); process.stdout.write(x.designSha)' "$RUNNER_TEMP/beta-release.json")
            shell="$sha"
            design="$sha"
          else
            echo "Cannot read deployed beta release (HTTP $status)" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "design=$design" >> "$GITHUB_OUTPUT"
      - name: Checkout the deployed beta design
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: design
          persist-credentials: false
      - name: Clear the checkout data before restoring the refresh snapshot
        if: ${{ inputs.use_refresh_artifact == true }}
        run: rm -rf main/data
      - name: Use the refresh snapshot
        if: ${{ inputs.use_refresh_artifact == true }}
        uses: actions/download-artifact@v4
        with:
          name: validated-beta-data
          path: main/data
      - name: Fetch the refresh catalog artifact
        if: ${{ inputs.use_refresh_artifact == true }}
        uses: actions/download-artifact@v4
        with:
          name: validated-aws-site
          path: ${{ runner.temp }}/production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate the pinned beta design with current data
        run: |
          rm -rf design/data
          cp -R main/data design/data
          cd design
          npm ci
          npm run build
          npm test
      - name: Verify catalog matches the validated production snapshot
        env:
          FROM_REFRESH: ${{ inputs.use_refresh_artifact }}
        run: |
          if [ "$FROM_REFRESH" = true ]; then
            unzip -p "$RUNNER_TEMP/production/rivspotter-site.zip" api/v1/catalog.json > "$RUNNER_TEMP/expected-catalog.json"
          else
            curl --fail --silent --show-error https://rivspotter.com/api/v1/catalog.json > "$RUNNER_TEMP/expected-catalog.json"
          fi
          cmp "$RUNNER_TEMP/expected-catalog.json" design/dist/api/v1/catalog.json
      - name: Package data, generated pages and offline fallback only
        env:
          BETA_SHELL_RELEASE: ${{ steps.release.outputs.shell }}
          BETA_DESIGN_SHA: ${{ steps.release.outputs.design }}
        run: |
          if [ -z "$BETA_DESIGN_SHA" ]; then
            curl --fail --silent --show-error https://beta.rivspotter.com/service-worker.js > "$RUNNER_TEMP/current-beta-worker.js"
            grep -F "const RELEASE = '$BETA_SHELL_RELEASE';" "$RUNNER_TEMP/current-beta-worker.js"
          fi
          node main/scripts/beta-data-snapshot.cjs design/dist "$RUNNER_TEMP/beta-data"
          if [ -n "$BETA_DESIGN_SHA" ]; then
            curl --fail --silent --show-error "https://beta.d3qy7654vf25z2.amplifyapp.com/beta-releases/$BETA_DESIGN_SHA/js/app.js" > "$RUNNER_TEMP/current-app.js"
            cmp "$RUNNER_TEMP/current-app.js" "$RUNNER_TEMP/beta-data/files/js/app.js"
          fi
          cd "$RUNNER_TEMP/beta-data/files"
          zip -qr "$RUNNER_TEMP/beta-data.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: validated-beta-data-site
          path: ${{ runner.temp }}/beta-data.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: validated-beta-data-manifest
          path: ${{ runner.temp }}/beta-data/manifest.json
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-beta-data-site
          path: ${{ runner.temp }}/beta-data
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_AMPLIFY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy and verify the isolated beta data origin
        env:
          AMPLIFY_APP_ID: ${{ vars.AWS_AMPLIFY_APP_ID }}
        run: node scripts/deploy-amplify.cjs "$RUNNER_TEMP/beta-data/beta-data.zip" beta-data
